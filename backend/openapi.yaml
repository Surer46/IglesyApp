openapi: 3.0.3
info:
  title: AppIglesia API
  version: 1.0.0
  description: |
    Contrato de la API (specs.md §7). Respuestas `{ data, meta? }`; errores `{ error: { code, message, details? } }`.
    Cada dueño agrega aquí las rutas de su módulo (B2: miembros/ministerios, B3: eventos/asistencia/anuncios/public, B4: donaciones/dashboard/reportes).
servers:
  - url: /api/v1
tags:
  - name: Sistema
  - name: Auth
  - name: Usuarios
  - name: Configuración
  - name: Miembros
  - name: Ministerios
  - name: Eventos
  - name: Asistencia
  - name: Anuncios
  - name: Público

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieRefresh:
      type: apiKey
      in: cookie
      name: refreshToken
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Q: { name: q, in: query, schema: { type: string } }
    Orden: { name: orden, in: query, schema: { type: string, example: 'nombre:asc' } }
  schemas:
    Rol:
      type: string
      enum: [ADMIN, PASTOR, SECRETARIO, TESORERO, COORDINADOR]
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION_ERROR,
                  UNAUTHENTICATED,
                  TOKEN_EXPIRED,
                  FORBIDDEN,
                  NOT_FOUND,
                  CONFLICT,
                  BUSINESS_RULE,
                  RATE_LIMITED,
                  INTERNAL_ERROR,
                ]
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  campo: { type: string }
                  mensaje: { type: string }
    Meta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }
        rol: { $ref: '#/components/schemas/Rol' }
        activo: { type: boolean }
        ultimoAcceso: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Sesion:
      type: object
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        permisos:
          type: array
          items: { type: string, example: 'miembros:leer' }
    Configuracion:
      type: object
      properties:
        nombre: { type: string }
        logoUrl: { type: string, nullable: true, description: URL absoluta del logotipo }
        direccion: { type: string, nullable: true }
        ciudad: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        email: { type: string, nullable: true }
        sitioWeb: { type: string, nullable: true }
        moneda: { type: string, example: MXN }
        zonaHoraria: { type: string, example: America/Mexico_City }
    Horario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        diaSemana: { type: integer, minimum: 0, maximum: 6, description: '0 = domingo' }
        horaInicio: { type: string, example: '10:00' }
        horaFin: { type: string, nullable: true, example: '12:00' }
        lugar: { type: string, nullable: true }
        activo: { type: boolean }
    MiembroEntrada:
      type: object
      properties:
        nombre: { type: string, maxLength: 80 }
        apellidos: { type: string, maxLength: 120 }
        fechaIngreso: { type: string, format: date, description: No futura }
        telefono:
          {
            type: string,
            nullable: true,
            description: '7–15 dígitos; se aceptan +, espacios y guiones (se guarda sin separadores)',
          }
        email: { type: string, format: email, nullable: true }
        fechaNacimiento: { type: string, format: date, nullable: true }
        direccion: { type: string, nullable: true }
        notas: { type: string, nullable: true }
    Miembro:
      allOf:
        - { $ref: '#/components/schemas/MiembroEntrada' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            activo: { type: boolean }
            fechaBaja: { type: string, format: date, nullable: true }
            motivoBaja: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MinisterioResumen:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    Ministerio:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        activo: { type: boolean }
        totalIntegrantes: { type: integer, description: Vínculos activos }
        coordinadores:
          type: array
          items: { type: object, properties: { id: { type: string }, nombre: { type: string } } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Integrante:
      type: object
      properties:
        id: { type: string, format: uuid, description: Id del miembro }
        nombre: { type: string }
        apellidos: { type: string }
        telefono: { type: string, nullable: true }
        email: { type: string, nullable: true }
        miembroActivo: { type: boolean }
        activo: { type: boolean, description: Vínculo activo }
        fechaUnion: { type: string, format: date-time }
        fechaSalida: { type: string, format: date-time, nullable: true }
    EventoEntrada:
      type: object
      properties:
        titulo: { type: string, maxLength: 150 }
        descripcion: { type: string, maxLength: 2000, nullable: true }
        tipo: { type: string, enum: [RELIGIOSO, ADMINISTRATIVO] }
        categoria: { type: string, enum: [CULTO, REUNION, ACTIVIDAD, OTRO] }
        fechaInicio: { type: string, format: date-time }
        fechaFin:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: 'Igual o posterior a fechaInicio',
          }
        lugar: { type: string, maxLength: 150 }
        ministerioId: { type: string, format: uuid, nullable: true }
    Evento:
      type: object
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        descripcion: { type: string, nullable: true }
        tipo: { type: string, enum: [RELIGIOSO, ADMINISTRATIVO] }
        categoria: { type: string, enum: [CULTO, REUNION, ACTIVIDAD, OTRO] }
        fechaInicio: { type: string, format: date-time }
        fechaFin: { type: string, format: date-time, nullable: true }
        lugar: { type: string }
        estado: { type: string, enum: [PROGRAMADO, CANCELADO, REALIZADO] }
        motivoCancelacion: { type: string, nullable: true }
        ministerio:
          allOf: [{ $ref: '#/components/schemas/MinisterioResumen' }]
          nullable: true
        totalResponsables: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EventoDetalle:
      allOf:
        - { $ref: '#/components/schemas/Evento' }
        - type: object
          properties:
            creadoPor:
              { type: object, properties: { id: { type: string }, nombre: { type: string } } }
            responsables:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nombre: { type: string }
                  apellidos: { type: string }
                  activo: { type: boolean }
            resumenAsistencia:
              type: object
              nullable: true
              properties:
                presentes: { type: integer }
                ausentes: { type: integer }
                total: { type: integer }
    MiembroBreve:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        apellidos: { type: string }
    ListaAsistencia:
      type: object
      properties:
        evento:
          type: object
          properties:
            id: { type: string, format: uuid }
            titulo: { type: string }
            fechaInicio: { type: string, format: date-time }
            fechaFin: { type: string, format: date-time, nullable: true }
            estado: { type: string, enum: [PROGRAMADO, CANCELADO, REALIZADO] }
            ministerio:
              allOf: [{ $ref: '#/components/schemas/MinisterioResumen' }]
              nullable: true
        registros:
          type: array
          items:
            type: object
            properties:
              miembro: { $ref: '#/components/schemas/MiembroBreve' }
              presente: { type: boolean, nullable: true, description: 'null = sin registrar' }
        totales:
          type: object
          properties:
            presentes: { type: integer }
            ausentes: { type: integer }
            sinRegistrar: { type: integer }
            total: { type: integer }
    AnuncioEntrada:
      type: object
      properties:
        titulo: { type: string, maxLength: 120 }
        contenido: { type: string, maxLength: 5000, description: Texto plano o markdown simple }
        prioridad: { type: string, enum: [NORMAL, IMPORTANTE], default: NORMAL }
        fechaPublicacion: { type: string, format: date-time, description: Por defecto ahora }
        fechaExpiracion:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: 'Posterior a fechaPublicacion',
          }
        eventoId: { type: string, format: uuid, nullable: true }
    Anuncio:
      type: object
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        contenido: { type: string }
        prioridad: { type: string, enum: [NORMAL, IMPORTANTE] }
        fechaPublicacion: { type: string, format: date-time }
        fechaExpiracion: { type: string, format: date-time, nullable: true }
        autor: { type: object, properties: { id: { type: string }, nombre: { type: string } } }
        evento:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            titulo: { type: string }
            fechaInicio: { type: string, format: date-time }
            estado: { type: string, enum: [PROGRAMADO, CANCELADO, REALIZADO] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
  responses:
    SinContenido: { description: Sin contenido }
    Validacion:
      {
        description: Datos no válidos,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    NoAutenticado:
      {
        description: Sin sesión o token expirado,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    Prohibido:
      {
        description: El rol no tiene permiso,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    NoEncontrado:
      {
        description: No existe,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    Conflicto:
      {
        description: Duplicado,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    ReglaNegocio:
      {
        description: Regla de negocio,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }

security:
  - bearer: []

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servidor
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      data: { type: object, properties: { status: { type: string, example: ok } } },
                    },
                }

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión (rate limit 5/min/IP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email, password],
                properties: { email: { type: string }, password: { type: string } },
              }
      responses:
        '200':
          description: Access token + sesión. Además fija la cookie httpOnly `refreshToken`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/Sesion' }
                      - { type: object, properties: { accessToken: { type: string } } }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '429': { description: Demasiados intentos }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rota el refresh token (cookie) y devuelve un access token nuevo
      security: [{ cookieRefresh: [] }]
      responses:
        '200':
          description: OK
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties:
                        { data: { type: object, properties: { accessToken: { type: string } } } },
                    },
                },
            }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoca el refresh token y borra la cookie
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Usuario actual y sus permisos
      responses:
        '200':
          description: OK
          content:
            {
              application/json:
                {
                  schema:
                    { type: object, properties: { data: { $ref: '#/components/schemas/Sesion' } } },
                },
            }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /auth/me/password:
    patch:
      tags: [Auth]
      summary: Cambiar la contraseña propia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [passwordActual, passwordNueva],
                properties: { passwordActual: { type: string }, passwordNueva: { type: string } },
              }
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Envía un enlace de restablecimiento (responde 204 siempre)
      security: []
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { type: object, required: [email], properties: { email: { type: string } } },
              },
          }
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '400': { $ref: '#/components/responses/Validacion' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Fija una contraseña nueva con el token del correo (recuperación o invitación)
      security: []
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [token, password],
                    properties: { token: { type: string }, password: { type: string } },
                  },
              },
          }
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '400': { $ref: '#/components/responses/Validacion' }

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios (ADMIN)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Orden' }
        - { name: rol, in: query, schema: { $ref: '#/components/schemas/Rol' } }
        - { name: activo, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      data: { type: array, items: { $ref: '#/components/schemas/Usuario' } },
                      meta: { $ref: '#/components/schemas/Meta' },
                    },
                }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Usuarios]
      summary: Crear usuario (ADMIN). Sin password se envía invitación por correo (48 h).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, rol]
              properties:
                {
                  nombre: { type: string },
                  email: { type: string },
                  rol: { $ref: '#/components/schemas/Rol' },
                  password: { type: string },
                }
      responses:
        '201':
          {
            description: Creado,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { $ref: '#/components/schemas/Usuario' } },
                      },
                  },
              },
          }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /usuarios/opciones:
    get:
      tags: [Usuarios]
      summary: Usuarios activos para selectores (ADMIN, PASTOR)
      parameters:
        - { name: rol, in: query, schema: { $ref: '#/components/schemas/Rol' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      data:
                        {
                          type: array,
                          items:
                            {
                              type: object,
                              properties:
                                {
                                  id: { type: string },
                                  nombre: { type: string },
                                  rol: { $ref: '#/components/schemas/Rol' },
                                },
                            },
                        },
                    },
                }
        '403': { $ref: '#/components/responses/Prohibido' }
  /usuarios/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Usuarios]
      summary: Detalle de usuario (ADMIN)
      responses:
        '200':
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { $ref: '#/components/schemas/Usuario' } },
                      },
                  },
              },
          }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Usuarios]
      summary: Editar nombre, correo o rol (ADMIN)
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    properties:
                      {
                        nombre: { type: string },
                        email: { type: string },
                        rol: { $ref: '#/components/schemas/Rol' },
                      },
                  },
              },
          }
      responses:
        '200':
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { $ref: '#/components/schemas/Usuario' } },
                      },
                  },
              },
          }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /usuarios/{id}/estado:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Usuarios]
      summary: Activar o desactivar (ADMIN). Desactivar revoca sus sesiones.
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { type: object, required: [activo], properties: { activo: { type: boolean } } },
              },
          }
      responses:
        '200':
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { $ref: '#/components/schemas/Usuario' } },
                      },
                  },
              },
          }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /usuarios/{id}/reenviar-invitacion:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Usuarios]
      summary: Reenvía el correo para configurar contraseña (ADMIN)
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /configuracion:
    get:
      tags: [Configuración]
      summary: Datos de la iglesia (público)
      security: []
      responses:
        '200':
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { $ref: '#/components/schemas/Configuracion' } },
                      },
                  },
              },
          }
    put:
      tags: [Configuración]
      summary: Actualizar datos de la iglesia (ADMIN)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Configuracion' } } }
      responses:
        '200':
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { $ref: '#/components/schemas/Configuracion' } },
                      },
                  },
              },
          }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /configuracion/logo:
    post:
      tags: [Configuración]
      summary: Subir logotipo (ADMIN). PNG, JPG, WEBP o SVG ≤ 2 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              {
                type: object,
                required: [logo],
                properties: { logo: { type: string, format: binary } },
              }
      responses:
        '200':
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { data: { $ref: '#/components/schemas/Configuracion' } },
                      },
                  },
              },
          }
        '400': { $ref: '#/components/responses/Validacion' }
  /configuracion/horarios:
    get:
      tags: [Configuración]
      summary: Horarios de reuniones, ordenados por día y hora (público)
      security: []
      responses:
        '200':
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data: { type: array, items: { $ref: '#/components/schemas/Horario' } },
                          },
                      },
                  },
              },
          }
    post:
      tags: [Configuración]
      summary: Agregar horario (ADMIN)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Horario' } } }
      responses:
        '201': { description: Creado }
        '400': { $ref: '#/components/responses/Validacion' }
  /configuracion/horarios/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Configuración]
      summary: Editar horario (ADMIN)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Horario' } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Configuración]
      summary: Eliminar horario (ADMIN)
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /miembros:
    get:
      tags: [Miembros]
      summary: Listado paginado (miembros:leer)
      description: Búsqueda por nombre y apellidos sin distinguir mayúsculas ni acentos. Orden por defecto `apellidos:asc`.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Orden' }
        - name: estado
          in: query
          schema: { type: string, enum: [activo, inactivo, todos], default: activo }
        - { name: ministerioId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Miembro' }
                        - type: object
                          properties:
                            ministerios:
                              type: array
                              items: { $ref: '#/components/schemas/MinisterioResumen' }
                            totalMinisterios: { type: integer }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Miembros]
      summary: Registrar miembro (miembros:crear)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/MiembroEntrada' }
                - { required: [nombre, apellidos, fechaIngreso] }
      responses:
        '201':
          description: Creado. Si ya existe alguien con el mismo nombre y apellidos, `meta` lo advierte.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Miembro' }
                  meta:
                    type: object
                    properties:
                      posibleDuplicado: { type: boolean }
                      duplicadoId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /miembros/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Miembros]
      summary: Detalle con ministerios (actuales e históricos)
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Miembros]
      summary: Editar datos personales (miembros:editar); `activo` no se acepta aquí
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MiembroEntrada' } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /miembros/{id}/estado:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Miembros]
      summary: Desactivar / reactivar (miembros:eliminar)
      description: Al desactivar guarda fecha y motivo de baja y cierra sus vínculos de ministerio. Al reactivar los vínculos no se restauran.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties: { activo: { type: boolean }, motivo: { type: string, maxLength: 500 } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }

  /ministerios:
    get:
      tags: [Ministerios]
      summary: Listado con totalIntegrantes y coordinadores (ministerios:leer)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Orden' }
        - { name: activo, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Ministerio' } }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [Ministerios]
      summary: Crear (ADMIN, PASTOR); nombre único sin distinguir mayúsculas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                { nombre: { type: string }, descripcion: { type: string, nullable: true } }
      responses:
        '201': { description: Creado }
        '409': { $ref: '#/components/responses/Conflicto' }
  /ministerios/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Ministerios]
      summary: Detalle
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Ministerios]
      summary: Editar nombre / descripción (ADMIN, PASTOR)
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Conflicto' }
  /ministerios/{id}/estado:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Ministerios]
      summary: Desactivar / reactivar (ADMIN, PASTOR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [activo], properties: { activo: { type: boolean } } }
      responses:
        '200': { description: OK }
  /ministerios/{id}/coordinadores:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Ministerios]
      summary: Reemplazar coordinadores (ADMIN, PASTOR)
      description: Solo usuarios activos con rol COORDINADOR o PASTOR. Lista vacía permitida.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuarioIds]
              properties: { usuarioIds: { type: array, items: { type: string, format: uuid } } }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /ministerios/{id}/miembros:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Ministerios]
      summary: Integrantes (por defecto solo vínculos activos)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Q' }
        - { name: incluirHistoricos, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Integrante' } }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [Ministerios]
      summary: Vincular miembros (ADMIN, PASTOR o COORDINADOR del ministerio)
      description: Reactiva vínculos previos; ids repetidos se ignoran; todo o nada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [miembroIds]
              properties: { miembroIds: { type: array, items: { type: string, format: uuid } } }
      responses:
        '200': { description: Ministerio actualizado }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /ministerios/{id}/miembros/{miembroId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: miembroId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Ministerios]
      summary: Desvincular (soft, guarda fechaSalida); ADMIN, PASTOR o COORDINADOR del ministerio
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /eventos:
    get:
      tags: [Eventos]
      summary: Eventos (eventos:leer)
      description: |
        Con `desde` y `hasta` (rango de hasta 93 días) devuelve todo el rango sin paginar (máx. 500), ordenado por `fechaInicio asc`,
        incluyendo eventos que empiezan antes de `desde` y terminan dentro del rango (calendario).
        Una fecha sin hora (`yyyy-MM-dd`) es el día completo en la zona horaria de la iglesia.
        Sin rango: paginado y ordenado por `fechaInicio desc`. Los programados cuya fecha ya pasó se marcan `REALIZADO` al consultar.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Orden' }
        - { name: desde, in: query, schema: { type: string, example: '2026-10-01' } }
        - { name: hasta, in: query, schema: { type: string, example: '2026-10-31T23:59:59Z' } }
        - { name: tipo, in: query, schema: { type: string, enum: [RELIGIOSO, ADMINISTRATIVO] } }
        - name: categoria
          in: query
          schema: { type: string, enum: [CULTO, REUNION, ACTIVIDAD, OTRO] }
        - name: estado
          in: query
          schema: { type: string, enum: [PROGRAMADO, CANCELADO, REALIZADO] }
        - { name: ministerioId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Evento' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Eventos]
      summary: Crear evento (eventos:crear; COORDINADOR solo con un ministerio que coordina)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/EventoEntrada' }
                - { required: [titulo, tipo, categoria, fechaInicio, lugar] }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { data: { $ref: '#/components/schemas/EventoDetalle' } },
                }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /eventos/proximos:
    get:
      tags: [Eventos]
      summary: Próximos eventos programados desde ahora (eventos:leer)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Evento' } }
  /eventos/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Eventos]
      summary: Detalle con responsables, ministerio, creador y resumenAsistencia
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { data: { $ref: '#/components/schemas/EventoDetalle' } },
                }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Eventos]
      summary: Editar (eventos:editar; COORDINADOR solo eventos de su ministerio)
      description: Un evento `CANCELADO` no se edita (422).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventoEntrada' } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /eventos/{id}/cancelar:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Eventos]
      summary: Cancelar (eventos:eliminar). No hay DELETE; la asistencia se conserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties: { motivo: { type: string, minLength: 5, maxLength: 300 } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /eventos/{id}/responsables:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Eventos]
      summary: Reemplaza los responsables (máx. 10 miembros activos)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [miembroIds]
              properties:
                miembroIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /eventos/{id}/asistencia:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Asistencia]
      summary: Pase de lista (asistencia:leer; COORDINADOR solo su ministerio)
      description: |
        Integrantes activos del ministerio del evento (o todos los miembros activos si no tiene ministerio),
        más quienes ya tienen registro aunque estén inactivos. `q` filtra por nombre; los totales son de toda la lista.
      parameters: [{ $ref: '#/components/parameters/Q' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { data: { $ref: '#/components/schemas/ListaAsistencia' } },
                }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Asistencia]
      summary: Registrar asistencia (upsert masivo, asistencia:crear)
      description: |
        Evento cancelado o que empieza en más de 1 día → 422. Reenviar la lista actualiza (no duplica).
        Si el evento ya empezó queda `REALIZADO`. Responde la lista actualizada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registros]
              properties:
                registros:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [miembroId, presente]
                    properties:
                      miembroId: { type: string, format: uuid }
                      presente: { type: boolean }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /asistencias:
    get:
      tags: [Asistencia]
      summary: Historial paginado con datos del evento (asistencia:leer; COORDINADOR solo sus ministerios)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: miembroId, in: query, schema: { type: string, format: uuid } }
        - { name: eventoId, in: query, schema: { type: string, format: uuid } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK (ordenado por fecha del evento desc) }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /asistencias/resumen:
    get:
      tags: [Asistencia]
      summary: Resumen semanal (semana ISO) o mensual en la zona horaria de la iglesia
      description: Serie continua (periodos sin datos con ceros). Por defecto 12 semanas o 6 meses hasta hoy; rango máx. 2 años.
      parameters:
        - name: periodo
          in: query
          required: true
          schema: { type: string, enum: [semanal, mensual] }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: ministerioId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        periodo: { type: string, example: '2026-W43' }
                        eventos: { type: integer }
                        presentes: { type: integer }
                        ausentes: { type: integer }
                        promedioPorEvento: { type: number }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /anuncios:
    get:
      tags: [Anuncios]
      summary: Anuncios paginados, IMPORTANTE primero (anuncios:leer)
      description: Con vigentes=true, publicados y no expirados; con vigentes=false, programados o expirados.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Q' }
        - { name: vigentes, in: query, schema: { type: boolean } }
        - name: estado
          in: query
          description: Pestañas del listado (paginadas por separado)
          schema: { type: string, enum: [vigentes, programados, expirados] }
        - { name: prioridad, in: query, schema: { type: string, enum: [NORMAL, IMPORTANTE] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Anuncio' } }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [Anuncios]
      summary: Publicar (anuncios:crear)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/AnuncioEntrada' }
                - { required: [titulo, contenido] }
      responses:
        '201': { description: Creado }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
  /anuncios/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Anuncios]
      summary: Detalle (anuncios:leer)
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Anuncios]
      summary: Editar (anuncios:editar)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AnuncioEntrada' } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
    delete:
      tags: [Anuncios]
      summary: Eliminar (borrado físico, anuncios:eliminar)
      responses:
        '204': { $ref: '#/components/responses/SinContenido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /public/cartelera:
    get:
      tags: [Público]
      summary: Cartelera pública (sin sesión; cache 60 s; 60 solicitudes/min por IP)
      description: Solo datos públicos; no incluye miembros, usuarios ni responsables.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      iglesia:
                        type: object
                        properties:
                          nombre: { type: string }
                          logoUrl: { type: string, nullable: true }
                          direccion: { type: string, nullable: true }
                          ciudad: { type: string, nullable: true }
                          telefono: { type: string, nullable: true }
                          email: { type: string, nullable: true }
                          sitioWeb: { type: string, nullable: true }
                      horarios: { type: array, items: { $ref: '#/components/schemas/Horario' } }
                      anuncios: { type: array, items: { type: object } }
                      eventosProximos: { type: array, items: { type: object } }
        '429': { description: Demasiadas solicitudes }
